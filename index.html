<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB6C1">
  
  <title>Tina AR - Doctora Dentina</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: #000;
    }
    
    #camera {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    #tina-3d {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 400px;
      height: 500px;
      --poster-color: transparent;
    }
    
    /* ========== ANIMACIONES TINA ========== */
    .anim-breathe { animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scale(1) translateY(0); }
      50% { transform: translateX(-50%) scale(1.03) translateY(-8px); }
    }
    
    .anim-brush { animation: brush 0.8s ease-in-out infinite; }
    @keyframes brush {
      0%, 100% { transform: translateX(-50%) translateY(0) rotateZ(0deg); }
      25% { transform: translateX(-50%) translateY(-12px) rotateZ(-8deg); }
      50% { transform: translateX(-50%) translateY(0) rotateZ(0deg); }
      75% { transform: translateX(-50%) translateY(-12px) rotateZ(8deg); }
    }
    
    .anim-encourage { animation: encourage 0.8s ease-in-out infinite; }
    @keyframes encourage {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      25% { transform: translateX(-50%) translateY(-15px) scale(1.05); }
      50% { transform: translateX(-50%) translateY(-25px) scale(1.08); }
      75% { transform: translateX(-50%) translateY(-15px) scale(1.05); }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }
    
    .anim-bounce { animation: bounce 1.2s ease-in-out; }
    @keyframes bounce {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      20% { transform: translateX(-50%) translateY(-40px) scale(1.15); }
      40% { transform: translateX(-50%) translateY(0) scale(0.95); }
      60% { transform: translateX(-50%) translateY(-25px) scale(1.08); }
      80% { transform: translateX(-50%) translateY(0) scale(0.98); }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }
    
    .anim-celebrate { animation: celebrate 0.5s ease-in-out infinite; }
    @keyframes celebrate {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      30% { transform: translateX(-50%) translateY(-45px) scale(1.18); }
      50% { transform: translateX(-50%) translateY(-15px) scale(1.1); }
      70% { transform: translateX(-50%) translateY(-40px) scale(1.15); }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }
    
    /* ========== OVERLAY BOCA ========== */
    #dental-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      padding: 20px;
    }
    
    #dental-overlay.show { opacity: 1; pointer-events: auto; }
    
    #dental-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
      text-align: center;
    }
    
    #dental-zone {
      font-size: 32px;
      font-weight: 800;
      color: #FFD700;
      margin-bottom: 15px;
      text-align: center;
      text-shadow: 0 0 15px rgba(255,215,0,0.6);
    }
    
    #mouth-container {
      position: relative;
      width: 260px;
      height: 240px;
      max-width: 90vw;
    }
    
    .side-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 700;
      color: white;
      padding: 6px 10px;
      background: linear-gradient(135deg, #FF69B4, #FF1493);
      border-radius: 15px;
      white-space: nowrap;
    }
    
    .side-indicator.left { left: -60px; animation: pulse-left 1s ease-in-out infinite; }
    .side-indicator.right { right: -60px; animation: pulse-right 1s ease-in-out infinite; }
    
    @keyframes pulse-left { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-5px); } }
    @keyframes pulse-right { 0%, 100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(5px); } }
    
    #dental-instruction {
      font-size: 14px;
      font-weight: 600;
      color: white;
      margin-top: 15px;
      text-align: center;
      opacity: 0.95;
    }
    
    .tooth { fill: #FFF; stroke: #DDD; stroke-width: 1; transition: fill 0.3s; }
    .tooth-hl { fill: #FFD700; filter: drop-shadow(0 0 8px #FFD700); }
    .tongue-hl { fill: #FF6B6B; filter: drop-shadow(0 0 10px #FF6B6B); }
    
    .hidden { display: none !important; }
    
    /* ========== UI ========== */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #FFB6C1, #FFC0CB);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    .spinner { width: 80px; height: 80px; border: 8px solid rgba(255,182,193,0.4); border-top: 8px solid #FF69B4; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #loading-text { color: #FF69B4; font-size: 26px; margin-top: 20px; font-weight: 700; }
    #loading-status { color: #FF69B4; font-size: 18px; margin-top: 10px; font-weight: 600; }
    
    #start-btn {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 25px 60px;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #FF69B4, #FF1493);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      z-index: 10000;
      display: none;
      box-shadow: 0 4px 25px rgba(255,105,180,0.6);
    }
    
    .dropdown-container { position: fixed; top: 15px; right: 15px; z-index: 100; }
    .dropdown-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 2px solid white;
      background: rgba(255,105,180,0.9); color: white; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .dropdown-content {
      display: none; position: absolute; top: 50px; right: 0;
      background: rgba(255,105,180,0.95); border-radius: 12px; overflow: hidden;
      min-width: 120px;
    }
    .dropdown-content.show { display: block; }
    .dropdown-item { padding: 12px 20px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
    .dropdown-item:hover { background: rgba(255,255,255,0.2); }
    .dropdown-item.active { background: white; color: #FF69B4; }
    
    #zones { position: fixed; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
    .zone-dot {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.4); border: 3px solid white;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: white;
    }
    .zone-dot.active { background: #FFD700; transform: scale(1.3); box-shadow: 0 0 15px #FFD700; color: #333; }
    
    #timer { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; z-index: 100; }
    #timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    #timer circle { fill: none; stroke-width: 8; }
    #timer .bg { stroke: rgba(255,255,255,0.3); }
    #timer .progress { stroke: #FF69B4; stroke-linecap: round; stroke-dasharray: 339.292; }
    #timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 36px; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    #timer-label { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); color: white; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    
    #message {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(255,105,180,0.95); color: white; padding: 16px 30px;
      border-radius: 30px; font-size: 18px; font-weight: 600; max-width: 90%; text-align: center; z-index: 100;
    }
    
    #music-btn {
      position: fixed; top: 70px; right: 15px; width: 44px; height: 44px;
      border-radius: 50%; background: rgba(255,105,180,0.9); color: white;
      border: 2px solid white; font-size: 18px; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    
    #restart-btn {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 18px 40px; background: linear-gradient(135deg, #FF69B4, #FF1493);
      color: white; border: none; border-radius: 30px; font-size: 20px; font-weight: 700;
      cursor: pointer; z-index: 200; display: none;
    }
    
    .confetti {
      position: fixed;
      width: 12px; height: 12px;
      top: -20px;
      border-radius: 50%;
      animation: fall 3s linear forwards;
      z-index: 500;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>

    // ===== ESTADO =====

    let zone = 0;
    let seconds = 30;
    let timer = null;
    let modelLoaded = false;
    let currentAnim = null;
    let idleTimer = null;
    let isIdle = true;
    let idlePhase = 'static';
    let musicPlaying = false;
    let speaking = false;
    let audioContext = null;
    let nextNoteTime = 0;
    let musicTimer = null;
    
    const $ = id => document.getElementById(id);
    const loading = $('loading');
    const loadingStatus = $('loading-status');

    const zonesEl = $('zones');
    const timerEl = $('timer');
    const timerText = $('timer-text');
    const timerLabel = $('timer-label');
    const timerProgress = document.querySelector('.progress');
    const message = $('message');

    const musicBtn = $('music-btn');
    const langBtn = $('lang-btn');
    const langDropdown = $('lang-dropdown');
    const dentalOverlay = $('dental-overlay');
    const dentalTitle = $('dental-title');

    const indicatorLeft = $('indicator-left');
    const indicatorRight = $('indicator-right');
    const tongue = $('tongue');
    const startBtn = $('start-btn');
    
    // ===== ANIMACIONES =====
    const ANIMS = ['breathe', 'brush', 'encourage', 'bounce', 'celebrate'];
    function setAnim(name, dur = null) {
      ANIMS.forEach(a => tina.classList.remove('anim-' + a));
      if (name) {
        tina.classList.add('anim-' + name);
        currentAnim = name;
        if (dur) setTimeout(() => { if (currentAnim === name) setAnim('breathe'); }, dur);
      }
    }
    
    function startIdleCycle() {
      stopIdleCycle();
      isIdle = true; idlePhase = 'static'; setAnim(null);
      idleTimer = setInterval(() => {
        if (!isIdle) return;
        if (idlePhase === 'static') { idlePhase = 'breathe'; setAnim('breathe'); }
        else { idlePhase = 'static'; setAnim(null); }
      }, 3000);
    }
    function stopIdleCycle() { if (idleTimer) { clearInterval(idleTimer); idleTimer = null; } }
    function pauseIdle() { isIdle = false; }
    function resumeIdle() {
      isIdle = true; idlePhase = 'static'; setAnim(null);
      if (!idleTimer) idleTimer = setInterval(() => {
        if (!isIdle) return;
        if (idlePhase === 'static') { idlePhase = 'breathe'; setAnim('breathe'); }
        else { idlePhase = 'static'; setAnim(null); }
      }, 3000);
    }
    
    // ===== TEXTOS =====

    // ===== MÚSICA =====
    const F = { // Frecuencias

        ['D4',0.25],['E4',0.25],['F4',0.5],['E4',0.25],['D4',0.25],['C4',0.5],['D4',1],
        ['E4',0.25],['F4',0.25],['G4',0.5],['F4',0.25],['E4',0.25],['D4',0.5],['E4',1],
        ['A4',0.5],['G4',0.25],['F4',0.25],['E4',0.5],['D4',0.5],['C4',0.5],['D4',1],
        ['A4',0.5],['G4',0.25],['A4',0.25],['B4',0.5],['A4',0.5],['G4',0.5],['F4',1]
      ],
      4: [ // Triunfal
        ['F4',0.5],['A4',0.5],['C5',0.5],['A4',0.5],['F4',0.5],['A4',0.5],['C5',1],
        ['C5',0.5],['A4',0.5],['F4',0.5],['A4',0.5],['G4',0.5],['A4',0.5],['B4',1],
        ['C5',0.5],['D5',0.25],['C5',0.25],['A4',0.5],['F4',0.5],['G4',0.5],['A4',0.5],['G4',1],
        ['F4',0.5],['A4',0.5],['C5',0.5],['A4',0.5],['F4',0.5],['G4',0.5],['F4',1]
      ],
      5: [ // Lengua
        ['E4',0.5],['G4',0.5],['B4',0.5],['E5',1],
        ['D5',0.5],['C5',0.5],['B4',0.5],['A4',1],
        ['G4',0.5],['A4',0.5],['B4',0.5],['C5',1],
        ['B4',0.5],['A4',0.5],['G4',0.5],['E4',1]
      ]
    };
    
    // Agregar notas faltantes para zona 2
    F.B3 = 246.94;
    F.G3 = 196.00;
    F.A3 = 220.00;
    
    let currentSong = null;
    let noteIndex = 0;
    
    function initAudio() {
      if (audioContext) return true;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        console.log('🔊 AudioContext state:', audioContext.state);
        return true;
      } catch (e) {
        console.error('Audio error:', e);
        return false;
      }
    }
    
    function playNote(freq, startTime, dur) {
      if (!audioContext || !freq) return;
      
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.15, startTime + 0.03);
      gain.gain.setValueAtTime(0.15, startTime + dur - 0.05);
      gain.gain.linearRampToValueAtTime(0, startTime + dur);
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      osc.start(startTime);
      osc.stop(startTime + dur);
    }
    
    function scheduleNotes() {
      if (!musicPlaying || !currentSong || !audioContext) return;
      
      while (nextNoteTime < audioContext.currentTime + 0.5) {
        const [note, dur] = currentSong[noteIndex];
        const freq = F[note];
        if (freq) {
          playNote(freq, nextNoteTime, dur);
        }
        nextNoteTime += dur;
        noteIndex++;
        
        if (noteIndex >= currentSong.length) {
          noteIndex = 0;
          nextNoteTime += 0.3; // Pausa entre repeticiones
        }
      }
      
      musicTimer = setTimeout(scheduleNotes, 200);
    }
    
    function startMusic(zoneNum) {
      if (!audioContext) {
        initAudio();
      }
      
      if (audioContext.state === 'suspended') {
        audioContext.resume().then(() => {
          console.log('AudioContext resumed');
          _startMusic(zoneNum);
        });
      } else {
        _startMusic(zoneNum);
      }
    }
    
    function _startMusic(zoneNum) {
      if (!audioContext) return;
      
      stopMusic();
      
      currentSong = SONGS[zoneNum];
      if (!currentSong) {
        console.error('No song for zone', zoneNum);
        return;
      }
      
      noteIndex = 0;
      nextNoteTime = audioContext.currentTime + 0.1;
      musicPlaying = true;
      musicBtn.textContent = '🔊';
      
      scheduleNotes();
      console.log('🎵 Playing song for zone', zoneNum);
    }
    
    function stopMusic() {
      musicPlaying = false;
      if (musicTimer) {
        clearTimeout(musicTimer);
        musicTimer = null;
      }
      currentSong = null;
      noteIndex = 0;
    }
    
    function playTransition(key) {
      if (!audioContext) return;
      
      const trans = {
        to1: [['C4',0.15],['E4',0.15],['G4',0.25]],
        to2: [['G4',0.15],['B4',0.15],['D5',0.25]],
        to3: [['D4',0.15],['F4',0.15],['A4',0.25]],
        to4: [['F4',0.15],['A4',0.15],['C5',0.25]],
        to5: [['E4',0.15],['G4',0.15],['B4',0.25]],
        end: [['C5',0.1],['E5',0.1],['G5',0.1],['C6',0.3]]
      };
      const notes = trans[key];
      if (!notes) return;
      
      let t = audioContext.currentTime + 0.05;
      notes.forEach(([note, dur]) => {
        if (F[note]) playNote(F[note], t, dur);
        t += dur;
      });
    }
    
    function toggleMusic() {
      if (musicPlaying) {
        stopMusic();
        musicBtn.textContent = '🎵';
      } else {
        if (!audioContext) initAudio();
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume();
        }
        startMusic(zone || 1);
      }
    }
    
    musicBtn.onclick = toggleMusic;
    
    // ===== CÁMARA =====
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        $('camera').srcObject = stream;
      } catch (e) {
        loadingStatus.textContent = 'Sin cámara';
      }
    }
    
    // ===== VOZ FEMENINA =====
    function speak(text, callback = null) {
      pauseIdle();
      speaking = true;
      
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang === 'ES' ? 'es-MX' : lang === 'EN' ? 'en-US' : 'pt-BR';
        u.rate = 0.9;
        u.pitch = 1.15;
        
        const voices = speechSynthesis.getVoices();
        let voice = null;
        
        if (lang === 'ES') {
          voice = voices.find(v => v.lang.includes('es-MX') || v.lang.includes('es-419')) ||
                  voices.find(v => v.lang.includes('es-ES'));
        } else if (lang === 'EN') {
          voice = voices.find(v => v.lang.includes('en-US'));
        } else {
          voice = voices.find(v => v.lang.includes('pt-BR'));
        }
        
        if (voice) u.voice = voice;
        
        setAnim('encourage');
        
        u.onend = () => {
          speaking = false;
          if (zone > 0 && zone <= 5) setAnim('brush');
          else resumeIdle();
          if (callback) setTimeout(callback, 500);
        };
        
        speechSynthesis.speak(u);
      }
    }
    
    // ===== BOCA =====
    function showDentalOverlay(zoneNum) {
      document.querySelectorAll('.tooth').forEach(t => t.classList.remove('tooth-hl'));
      tongue.classList.remove('tongue-hl');
      indicatorLeft.classList.add('hidden');
      indicatorRight.classList.add('hidden');
      
      if (zoneNum === 5) {
        tongue.classList.add('tongue-hl');
        dentalTitle.textContent = T[lang].tonguePrep;
        dentalZone.textContent = T[lang].zones[4];
        dentalInstruction.textContent = lang === 'ES' ? 'Cepilla suavemente de adentro hacia afuera' :
                                         lang === 'EN' ? 'Brush gently from back to front' :
                                         'Escove suavemente de dentro para fora';
      } else {
        const isUpper = zoneNum === 1 || zoneNum === 2;
        const isRight = zoneNum === 1 || zoneNum === 3;
        
        if (isRight) indicatorRight.classList.remove('hidden');
        else indicatorLeft.classList.remove('hidden');
        
        const ids = isUpper ? 
          (isRight ? ['u1','u2','u3'] : ['u4','u5','u6']) :
          (isRight ? ['l1','l2','l3'] : ['l4','l5','l6']);
        
        ids.forEach(id => { const el = $(id); if (el) el.classList.add('tooth-hl'); });
        
        dentalTitle.textContent = T[lang].zonePrep;
        dentalZone.textContent = T[lang].zones[zoneNum - 1];
        dentalInstruction.textContent = lang === 'ES' ? 'Haz circulitos suaves en esta zona' :
                                         lang === 'EN' ? 'Make small circles' : 'Faça circulinhos suaves';
      }
      
      dentalOverlay.classList.add('show');
    }
    
    function hideDentalOverlay() {
      dentalOverlay.classList.remove('show');
    }
    
    // ===== INICIO =====
    function startApp() {
      console.log('🦕 Starting app...');
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 500);
      
      startIdleCycle();
      message.textContent = T[lang].intro;
      speak(T[lang].intro);
      
      setTimeout(() => {
        initAudio();
        startMusic(1);
      }, 2500);
      
      setTimeout(nextZone, 12000);
    }
    
    function handleStart() {
      initAudio();
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      startBtn.style.display = 'none';
      startApp();
    }
    
    startBtn.onclick = handleStart;
    
    // ===== ZONAS =====
    function nextZone() {
      zone++;
      if (zone > 5) { celebrate(); return; }
      
      playTransition('to' + zone);
      showDentalOverlay(zone);
      
      const prepText = zone === 5 ? T[lang].tonguePrep : T[lang].zonePrep + ' ' + T[lang].zones[zone - 1];
      message.textContent = prepText;
      speak(prepText, () => {
        setTimeout(() => {
          hideDentalOverlay();
          startZoneTimer();
        }, 1500);
      });
    }
    
    function startZoneTimer() {
      stopIdleCycle();
      seconds = zone === 5 ? 10 : 30;
      
      zonesEl.classList.remove('hidden');
      timerEl.classList.remove('hidden');
      timerLabel.textContent = T[lang].zones[zone - 1];
      
      document.querySelectorAll('.zone-dot').forEach((d, i) => d.classList.toggle('active', i + 1 === zone));
      
      setTimeout(() => {
        message.textContent = zone === 5 ? T[lang].tongue : T[lang].zone.replace('{z}', T[lang].zones[zone - 1]);
        speak(message.textContent);
      }, 500);
      
      // Iniciar música para esta zona
      startMusic(zone);
      
      clearInterval(timer);
      
      let encI = 0;
      const dur = zone === 5 ? 10 : 30;
      
      timer = setInterval(() => {
        seconds--;
        timerText.textContent = seconds;
        timerProgress.style.strokeDashoffset = 339.292 * (1 - (dur - seconds) / dur);
        
        const thr = zone === 5 ? 5 : 10;
        timerProgress.style.stroke = seconds > thr ? '#4CAF50' : seconds > 3 ? '#FFC107' : '#F44336';
        
        const t1 = zone === 5 ? 5 : 20;
        const t2 = zone === 5 ? 3 : 10;
        
        if (!speaking && (seconds === t1 || seconds === t2)) {
          message.textContent = T[lang].encourage[encI++ % 4];
          speak(message.textContent);
        }
        
        if (!speaking && currentAnim !== 'brush') setAnim('brush');
        
        if (seconds <= 0) {
          clearInterval(timer);
          setAnim('bounce', 1200);
          setTimeout(nextZone, 1500);
        }
      }, 1000);
    }
    
    // ===== CELEBRACIÓN CON CONFETI =====
    function celebrate() {
      zonesEl.classList.add('hidden');
      timerEl.classList.add('hidden');
      
      stopMusic();
      playTransition('end');
      setAnim('celebrate');
      message.textContent = T[lang].celebrate;
      speak(T[lang].celebrate);
      
      // CREAR CONFETI
      const colors = ['#FF69B4','#FFB6C1','#FFD700','#87CEEB','#98FB98','#DDA0DD','#FF6347','#40E0D0'];
      for (let i = 0; i < 150; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = Math.random() * 2 + 's';
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
      
      // Mostrar botón de reinicio
      setTimeout(() => {
        musicBtn.textContent = '🎵';
        startIdleCycle();
        restartBtn.style.display = 'block';
        restartBtn.textContent = T[lang].restart;
      }, 4000);
    }
    
    // ===== DROPDOWN =====
    langBtn.onclick = () => langDropdown.classList.toggle('show');
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.onclick = () => {
        lang = item.dataset.lang;
        langBtn.textContent = lang;
        document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        langDropdown.classList.remove('show');
        message.textContent = T[lang].intro;
      };
    });
    document.onclick = (e) => { if (!e.target.closest('.dropdown-container')) langDropdown.classList.remove('show'); };
    restartBtn.onclick = () => location.reload();
    
    // ===== EVENTOS =====
    console.log('🦕 Initializing...');
    initCamera();
    
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
    speechSynthesis.getVoices();
    
    tina.addEventListener('progress', e => { loadingStatus.textContent = Math.floor(e.detail.totalProgress * 100) + '%'; });
    tina.addEventListener('load', () => {
      console.log('🦕 Model loaded!');
      modelLoaded = true;
      
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      if (isIOS) {
        loading.style.display = 'none';
        startBtn.style.display = 'block';
      } else {
        startApp();
      }
    });
    tina.addEventListener('error', e => { console.error('❌ Error:', e); loadingStatus.textContent = 'Error - recarga'; });
    
    setTimeout(() => { if (!modelLoaded) { console.log('⏰ Timeout'); startApp(); } }, 15000);
  </script>
</body>
</html>
