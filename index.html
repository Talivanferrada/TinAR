<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4FC3F7">
  <meta name="description" content="Tina AR - Experiencia educativa de realidad aumentada para enseñar técnica de cepillado dental a niños">
  
  <title>Tina AR - Doctora Dentina</title>
  
  <!-- Preload critical assets -->
  <link rel="preload" href="assets/models/Tina_optimized.glb" as="fetch" crossorigin>
  <link rel="preload" href="assets/targets/marker.mind" as="fetch" crossorigin>
  
  <!-- Preconnect to CDNs -->
  <link rel="preconnect" href="https://aframe.io">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Loading Overlay (UI-01) -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Cargando Tina...</div>
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>
  
  <!-- UI Overlay Container -->
  <div id="ui-overlay"></div>
  
  <!-- AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets/marker.mind; autoStart: true; showStats: false;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    background="transparent: true"
  >
    <a-assets>
      <a-asset-item id="tina-model" src="assets/models/Tina_optimized.glb"></a-asset-item>
    </a-assets>
    
    <!-- Lighting - CRITICAL for model visibility -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="0 2 1"></a-light>
    
    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <!-- Target -->
    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- Test: Simple colored cube to verify AR works -->
      <a-box 
        id="test-cube"
        position="0 0.3 0"
        scale="0.2 0.2 0.2"
        rotation="0 45 0"
        color="#4FC3F7"
        material="color: #4FC3F7; metalness: 0.3; roughness: 0.7"
      ></a-box>
      
      <!-- Tina Model - try loading after cube is visible -->
      <a-entity 
        id="tina" 
        gltf-model="#tina-model"
        position="0 0.5 0"
        scale="0.5 0.5 0.5"
        rotation="0 0 0"
        visible="true"
      ></a-entity>
    </a-entity>
  </a-scene>
  
  <script src="src/app.js" type="module"></script>
</body>
</html>
