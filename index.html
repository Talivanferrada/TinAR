<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4FC3F7">
  <meta name="description" content="Tina AR - Experiencia educativa de realidad aumentada para enseñar técnica de cepillado dental a niños">
  
  <title>Tina AR - Doctora Dentina</title>
  
  <!-- Styles FIRST -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Critical styles for camera background */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    
    #camera-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #tina-container {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    
    #tina-canvas {
      width: 300px;
      height: 400px;
    }
    
    #ui-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Camera Background -->
  <div id="camera-container">
    <video id="camera-video" autoplay playsinline muted></video>
  </div>
  
  <!-- Tina Container (will be rendered with Three.js) -->
  <div id="tina-container">
    <canvas id="tina-canvas"></canvas>
  </div>
  
  <!-- UI Layer -->
  <div id="ui-layer">
    <!-- Loading Overlay -->
    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: linear-gradient(135deg, #4FC3F7 0%, #29B6F6 100%); 
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;">
      <div class="spinner" style="width: 60px; height: 60px; border: 6px solid rgba(255, 255, 255, 0.3); 
        border-top: 6px solid #FFB74D; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div id="loading-text" style="color: white; font-size: 24px; margin-top: 20px;">Cargando Tina...</div>
    </div>
    
    <!-- Language Selector -->
    <div id="language-selector" class="language-selector" style="position: fixed; top: 20px; right: 20px; 
      display: flex; gap: 10px; pointer-events: auto; z-index: 200;">
      <button class="lang-btn active" data-lang="ES" style="min-width: 48px; min-height: 48px; padding: 12px 18px; 
        border: 2px solid white; background: rgba(0, 0, 0, 0.6); color: white; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;">ES</button>
      <button class="lang-btn" data-lang="EN" style="min-width: 48px; min-height: 48px; padding: 12px 18px; 
        border: 2px solid white; background: rgba(0, 0, 0, 0.6); color: white; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;">EN</button>
      <button class="lang-btn" data-lang="PT" style="min-width: 48px; min-height: 48px; padding: 12px 18px; 
        border: 2px solid white; background: rgba(0, 0, 0, 0.6); color: white; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;">PT</button>
    </div>
    
    <!-- Zone Indicators -->
    <div id="zone-indicators" class="zone-indicators hidden" style="position: fixed; top: 20px; left: 20px; 
      display: flex; flex-direction: column; gap: 8px; z-index: 160;">
      <div class="zone-dot" data-zone="1" style="width: 16px; height: 16px; border-radius: 50%; 
        background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);"></div>
      <div class="zone-dot" data-zone="2" style="width: 16px; height: 16px; border-radius: 50%; 
        background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);"></div>
      <div class="zone-dot" data-zone="3" style="width: 16px; height: 16px; border-radius: 50%; 
        background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);"></div>
      <div class="zone-dot" data-zone="4" style="width: 16px; height: 16px; border-radius: 50%; 
        background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6);"></div>
    </div>
    
    <!-- Timer -->
    <div id="timer-container" class="timer-container hidden" style="position: fixed; top: 100px; left: 50%; 
      transform: translateX(-50%); width: 100px; height: 100px; z-index: 150;">
      <svg class="timer-svg" viewBox="0 0 120 120" style="width: 100%; height: 100%; transform: rotate(-90deg);">
        <circle class="timer-bg" cx="60" cy="60" r="54" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8"></circle>
        <circle class="timer-progress" cx="60" cy="60" r="54" fill="none" stroke="#4CAF50" stroke-width="8" stroke-linecap="round"></circle>
      </svg>
      <div class="timer-content" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div class="timer-text" style="font-size: 28px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">30</div>
        <div class="timer-zone-label" style="font-size: 10px; color: rgba(255, 255, 255, 0.9);"></div>
      </div>
    </div>
    
    <!-- Message Display -->
    <div id="message-display" class="message-display" style="position: fixed; bottom: 80px; left: 50%; 
      transform: translateX(-50%); background: rgba(0, 0, 0, 0.75); color: white; padding: 16px 32px; 
      border-radius: 30px; font-size: 16px; max-width: 85%; text-align: center; z-index: 180;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);"></div>
  </div>
  
  <!-- Three.js for 3D model -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- App -->
  <script src="src/app-simple.js" type="module"></script>
  
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden { display: none !important; }
    .zone-dot.active {
      background: #FFB74D !important;
      border-color: white !important;
      box-shadow: 0 0 12px rgba(255, 183, 77, 0.8);
      transform: scale(1.3);
    }
  </style>
</body>
</html>
