<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF6B9D">
  
  <title>Tina AR - Doctora Dentina v3</title>
  <!-- Version 3: Tina Verde Animada con Musica -->
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard', cursive;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
    }
    
    /* Camera background */
    #camera {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    /* Overlay to make camera softer */
    #camera-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.1);
      z-index: 2;
      pointer-events: none;
    }
    
    /* Tina container */
    #tina-container {
      position: fixed;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    
    #tina-svg {
      width: 300px;
      height: 400px;
      filter: drop-shadow(0 15px 40px rgba(0,0,0,0.3));
    }
    
    /* Tina animations */
    .tina-body {
      animation: breathe 3s ease-in-out infinite;
      transform-origin: center bottom;
    }
    
    .tina-arm-left {
      animation: wave-arm 2s ease-in-out infinite;
      transform-origin: 160px 200px;
    }
    
    .tina-arm-right {
      animation: brush-motion 1s ease-in-out infinite;
      transform-origin: 240px 200px;
    }
    
    .tina-eye {
      animation: blink 4s ease-in-out infinite;
    }
    
    .tina-tail {
      animation: wag-tail 1.5s ease-in-out infinite;
      transform-origin: 280px 250px;
    }
    
    .tina-sparkle {
      animation: sparkle 1s ease-in-out infinite;
    }
    
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.02); }
    }
    
    @keyframes wave-arm {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
    }
    
    @keyframes brush-motion {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    
    @keyframes wag-tail {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes float-container {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-15px); }
    }
    
    #tina-container {
      animation: float-container 4s ease-in-out infinite;
    }
    
    /* Loading */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FF6B9D, #FFB74D);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    .spinner {
      width: 80px;
      height: 80px;
      border: 8px solid rgba(255,255,255,0.3);
      border-top: 8px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #loading-text {
      color: white;
      font-size: 28px;
      margin-top: 25px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    /* UI elements */
    #lang-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }
    
    .lang-btn {
      min-width: 55px;
      min-height: 55px;
      padding: 12px 18px;
      border: 3px solid white;
      background: rgba(255,107,157,0.8);
      color: white;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }
    
    .lang-btn.active {
      background: white;
      color: #FF6B9D;
      transform: scale(1.1);
    }
    
    #zones {
      position: fixed;
      top: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }
    
    .zone-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      border: 3px solid white;
      transition: all 0.3s;
    }
    
    .zone-dot.active {
      background: #FFD700;
      transform: scale(1.4);
      box-shadow: 0 0 20px #FFD700;
    }
    
    #timer {
      position: fixed;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 130px;
      z-index: 100;
    }
    
    #timer svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    
    #timer circle {
      fill: none;
      stroke-width: 10;
    }
    
    #timer .bg { stroke: rgba(255,255,255,0.3); }
    #timer .progress { stroke: #4CAF50; stroke-linecap: round; }
    
    #timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 42px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
    }
    
    #message {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,107,157,0.9);
      color: white;
      padding: 18px 36px;
      border-radius: 35px;
      font-size: 20px;
      max-width: 90%;
      text-align: center;
      z-index: 100;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border: 3px solid rgba(255,255,255,0.5);
    }
    
    #restart-btn {
      position: fixed;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 45px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
      border: none;
      border-radius: 35px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 6px 25px rgba(0,0,0,0.4);
      display: none;
      font-family: inherit;
    }
    
    /* Music button */
    #music-btn {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(255,107,157,0.9);
      color: white;
      border: 3px solid white;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
      display: none;
    }
    
    .confetti {
      position: fixed;
      width: 15px;
      height: 15px;
      top: -20px;
      animation: fall 3s linear forwards;
      z-index: 500;
      border-radius: 3px;
    }
    
    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Camera -->
  <video id="camera" autoplay playsinline muted></video>
  <div id="camera-overlay"></div>
  
  <!-- Tina - Dinosaurio basado en Doctora Dentina -->
  <div id="tina-container" class="hidden">
    <svg id="tina-svg" viewBox="0 0 300 400">

        <!-- Teeth in smile -->
        <rect x="125" y="145" width="10" height="12" rx="2" fill="white"/>

        <!-- Dino spikes on head -->
        <polygon points="90,70 100,40 110,70" fill="#FFD700"/>

      <!-- Bow tie /Accessory -->
      <ellipse cx="150" cy="185" rx="25" ry="10" fill="#FF6B9D"/>

      <ellipse cx="125" cy="185" rx="15" ry="8" fill="#FF6B9D" transform="rotate(-30 125 185)"/>

  </div>
  
  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Cargando a Tina...</div>
  </div>
  
  <!-- Music button -->
  <button id="music-btn">🎵 Música</button>
  
  <!-- UI -->
  <div id="lang-selector">
    <button class="lang-btn active" data-lang="ES">ES</button>
    <button class="lang-btn" data-lang="EN">EN</button>
    <button class="lang-btn" data-lang="PT">PT</button>
  </div>
  
  <div id="zones" class="hidden">
    <div class="zone-dot" data-zone="1"></div>
    <div class="zone-dot" data-zone="2"></div>
    <div class="zone-dot" data-zone="3"></div>
    <div class="zone-dot" data-zone="4"></div>
  </div>
  
  <div id="timer" class="hidden">
    <svg viewBox="0 0 120 120">
      <circle class="bg" cx="60" cy="60" r="54"/>
      <circle class="progress" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="0"/>
    </svg>
    <div id="timer-text">30</div>
  </div>
  
  <div id="message"></div>
  <button id="restart-btn">🔄 Jugar de nuevo</button>
  
  <script>
    // ===== APP STATE =====
    let lang = 'ES';
    let zone = 0;
    let seconds = 30;
    let timer = null;
    let audioContext = null;
    let musicPlaying = false;
    let musicNodes = [];
    
    // Elements
    const camera = document.getElementById('camera');
    const loading = document.getElementById('loading');
    const tinaContainer = document.getElementById('tina-container');
    const zonesEl = document.getElementById('zones');
    const timerEl = document.getElementById('timer');
    const timerText = document.getElementById('timer-text');
    const timerProgress = document.querySelector('.progress');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart-btn');
    const musicBtn = document.getElementById('music-btn');
    
    // ===== TEXTS =====
    const TEXTS = {
      ES: {
        intro: '¡Hola! Soy Tina la dinosauria. ¡Vamos a cepillarnos los dientes juntos!',
        zone: 'Ahora cepillemos la zona {z}. ¡Inclina el cepillo 45° y haz círculos pequeños!',
        encourage: ['¡Muy bien!', '¡Excelente!', '¡Sigue así!', '¡Qué bien lo haces!'],
        celebrate: '¡Fantástico! ¡Cepillaste todos tus dientes como un campeón! 🎉',
        restart: '🔄 Jugar de nuevo',
        music: '🎵 Música'
      },
      EN: {
        intro: 'Hi! I\'m Tina the dinosaur. Let\'s brush our teeth together!',
        zone: 'Now let\'s brush the {z} area. Tilt the brush 45° and make small circles!',
        encourage: ['Great job!', 'Excellent!', 'Keep going!', 'You\'re doing great!'],
        celebrate: 'Fantastic! You brushed all your teeth like a champion! 🎉',
        restart: '🔄 Play again',
        music: '🎵 Music'
      },
      PT: {
        intro: 'Olá! Sou Tina a dinossauro. Vamos escovar os dentes juntos!',
        zone: 'Agora vamos escovar a área {z}. Incline a escova 45° e faça círculos pequenos!',
        encourage: ['Muito bem!', 'Excelente!', 'Continue assim!', 'Você está indo muito bem!'],
        celebrate: 'Fantástico! Você escovou todos os dentes como um campeão! 🎉',
        restart: '🔄 Jogar de novo',
        music: '🎵 Música'
      }
    };
    
    const ZONE_NAMES = {
      ES: ['superior derecha', 'superior izquierda', 'inferior derecha', 'inferior izquierda'],
      EN: ['right upper', 'left upper', 'right lower', 'left lower'],
      PT: ['superior direita', 'superior esquerda', 'inferior direita', 'inferior esquerda']
    };
    
    // ===== MUSIC SYSTEM =====
    function createAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }
    
    function playBackgroundMusic() {
      if (musicPlaying) return;
      
      const ctx = createAudioContext();
      musicPlaying = true;
      musicBtn.textContent = '🔊 ' + TEXTS[lang].music;
      
      // Simple happy melody using Web Audio API
      const playNote = (freq, startTime, duration, volume = 0.1) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.05);
        gain.gain.linearRampToValueAtTime(volume * 0.7, startTime + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
        
        musicNodes.push(osc);
      };
      
      // Happy melody notes (C major scale)
      const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 783.99, 698.46];
      const noteDuration = 0.4;
      
      const playMelody = () => {
        if (!musicPlaying) return;
        
        const now = ctx.currentTime;
        notes.forEach((freq, i) => {
          playNote(freq, now + i * noteDuration, noteDuration * 0.9);
        });
        
        // Repeat melody
        setTimeout(playMelody, notes.length * noteDuration * 1000);
      };
      
      playMelody();
    }
    
    function stopBackgroundMusic() {
      musicPlaying = false;
      musicBtn.textContent = TEXTS[lang].music;
      musicNodes.forEach(node => {
        try { node.stop(); } catch(e) {}
      });
      musicNodes = [];
    }
    
    musicBtn.onclick = () => {
      if (musicPlaying) {
        stopBackgroundMusic();
      } else {
        playBackgroundMusic();
      }
    };
    
    // ===== CAMERA =====
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        camera.srcObject = stream;
        await camera.play();
        console.log('✅ Camera OK');
        return true;
      } catch (e) {
        console.error('❌ Camera error:', e);
        document.getElementById('loading-text').textContent = 'Activa la cámara';
        return false;
      }
    }
    
    // ===== SPEECH =====
    function speak(text) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang === 'ES' ? 'es-ES' : lang === 'EN' ? 'en-US' : 'pt-PT';
        u.rate = 0.85;
        u.pitch = 1.1;
        speechSynthesis.speak(u);
      }
    }
    
    // ===== UI HELPERS =====
    function show(text) {
      messageEl.textContent = text;
    }
    
    // ===== EXPERIENCE FLOW =====
    function start() {
      loading.classList.add('hidden');
      tinaContainer.classList.remove('hidden');
      musicBtn.style.display = 'block';
      
      show(TEXTS[lang].intro);
      speak(TEXTS[lang].intro);
      
      // Auto-start music after user interaction
      setTimeout(() => {
        if (!musicPlaying) playBackgroundMusic();
      }, 1000);
      
      setTimeout(() => nextZone(), 5000);
    }
    
    let encourageInterval = null;
    
    function nextZone() {
      zone++;
      
      if (zone > 4) {
        celebrate();
        return;
      }
      
      seconds = 30;
      zonesEl.classList.remove('hidden');
      timerEl.classList.remove('hidden');
      
      // Update zone dots
      document.querySelectorAll('.zone-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i + 1 === zone);
      });
      
      const zoneName = ZONE_NAMES[lang][zone - 1];
      const text = TEXTS[lang].zone.replace('{z}', zoneName);
      show(text);
      speak(text);
      
      // Clear previous timer
      clearInterval(timer);
      clearInterval(encourageInterval);
      
      // Encouragement every 8 seconds
      let encourageIndex = 0;
      encourageInterval = setInterval(() => {
        if (zone <= 4 && seconds > 5) {
          speak(TEXTS[lang].encourage[encourageIndex % TEXTS[lang].encourage.length]);
          encourageIndex++;
        }
      }, 8000);
      
      // Start timer
      timer = setInterval(() => {
        seconds--;
        timerText.textContent = seconds;
        
        // Update progress
        const prog = (30 - seconds) / 30;
        timerProgress.style.strokeDashoffset = 339.292 * (1 - prog);
        
        // Color
        timerProgress.style.stroke = seconds > 10 ? '#4CAF50' : seconds > 5 ? '#FFC107' : '#F44336';
        
        if (seconds <= 0) {
          clearInterval(timer);
          clearInterval(encourageInterval);
          nextZone();
        }
      }, 1000);
    }
    
    function celebrate() {
      zonesEl.classList.add('hidden');
      timerEl.classList.add('hidden');
      
      show(TEXTS[lang].celebrate);
      speak(TEXTS[lang].celebrate);
      
      // Confetti
      const colors = ['#FF6B9D', '#4ECDC4', '#FFD700', '#95E1D3', '#FFB74D', '#7CB342'];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
      
      // Stop music
      setTimeout(stopBackgroundMusic, 3000);
      
      // Show restart
      setTimeout(() => {
        restartBtn.style.display = 'block';
        restartBtn.textContent = TEXTS[lang].restart;
      }, 2000);
    }
    
    // ===== LANGUAGE =====
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        lang = btn.dataset.lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        musicBtn.textContent = (musicPlaying ? '🔊 ' : '🎵 ') + TEXTS[lang].music.split(' ')[1];
      };
    });
    
    // ===== RESTART =====
    restartBtn.onclick = () => location.reload();
    
    // ===== INIT =====
    initCamera().then(() => {
      setTimeout(start, 800);
    });
  </script>
</body>
</html>
