<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4FC3F7">
  
  <title>Tina AR - Doctora Dentina</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #000;
    }
    
    /* Camera background */
    #camera {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    /* Tina character - animated */
    #tina-container {
      position: fixed;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      animation: float 3s ease-in-out infinite;
    }
    
    #tina-img {
      width: 280px;
      height: auto;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
    }
    
    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-10px); }
    }
    
    /* Loading */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4FC3F7, #29B6F6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid #FFB74D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loading-text {
      color: white;
      font-size: 24px;
      margin-top: 20px;
    }
    
    /* Language selector */
    #lang-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    
    .lang-btn {
      min-width: 50px;
      min-height: 50px;
      padding: 10px 16px;
      border: 2px solid white;
      background: rgba(0,0,0,0.6);
      color: white;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .lang-btn.active {
      background: white;
      color: #29B6F6;
    }
    
    /* Zone indicators */
    #zones {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }
    
    .zone-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: 2px solid white;
      transition: all 0.3s;
    }
    
    .zone-dot.active {
      background: #FFB74D;
      transform: scale(1.3);
      box-shadow: 0 0 15px #FFB74D;
    }
    
    /* Timer */
    #timer {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      z-index: 100;
    }
    
    #timer svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    
    #timer circle {
      fill: none;
      stroke-width: 8;
    }
    
    #timer .bg { stroke: rgba(255,255,255,0.2); }
    #timer .progress { stroke: #4CAF50; stroke-linecap: round; }
    
    #timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 36px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    /* Message */
    #message {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 18px;
      max-width: 90%;
      text-align: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    
    /* Restart button */
    #restart-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 18px 36px;
      background: linear-gradient(135deg, #FFB74D, #FF9800);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: none;
    }
    
    /* Confetti */
    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      top: -20px;
      animation: fall 3s linear forwards;
      z-index: 500;
    }
    
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Camera -->
  <video id="camera" autoplay playsinline muted></video>
  
  <!-- Tina Character -->
  <div id="tina-container" class="hidden">
    <svg id="tina-img" viewBox="0 0 200 280" width="280">
      <!-- Dinosaur body -->
      <ellipse cx="100" cy="180" rx="60" ry="70" fill="#4FC3F7"/>
      <!-- Head -->
      <circle cx="100" cy="80" r="50" fill="#4FC3F7"/>
      <!-- Eyes -->
      <circle cx="80" cy="70" r="12" fill="white"/>
      <circle cx="120" cy="70" r="12" fill="white"/>
      <circle cx="82" cy="72" r="6" fill="#333"/>
      <circle cx="122" cy="72" r="6" fill="#333"/>
      <!-- Smile -->
      <path d="M 70 95 Q 100 120 130 95" stroke="white" stroke-width="4" fill="none"/>
      <!-- Teeth -->
      <rect x="85" y="100" width="8" height="12" rx="2" fill="white"/>
      <rect x="107" y="100" width="8" height="12" rx="2" fill="white"/>
      <!-- Arms -->
      <ellipse cx="50" cy="160" rx="15" ry="25" fill="#29B6F6"/>
      <ellipse cx="150" cy="160" rx="15" ry="25" fill="#29B6F6"/>
      <!-- Legs -->
      <ellipse cx="70" cy="250" rx="20" ry="25" fill="#29B6F6"/>
      <ellipse cx="130" cy="250" rx="20" ry="25" fill="#29B6F6"/>
      <!-- Tail -->
      <path d="M 160 180 Q 200 180 190 150 Q 180 120 200 100" stroke="#4FC3F7" stroke-width="20" fill="none" stroke-linecap="round"/>
      <!-- Spikes -->
      <polygon points="60,30 70,50 80,30" fill="#FFB74D"/>
      <polygon points="90,20 100,45 110,20" fill="#FFB74D"/>
      <polygon points="120,30 130,50 140,30" fill="#FFB74D"/>
      <!-- Toothbrush -->
      <rect x="35" y="135" width="40" height="8" rx="2" fill="#FF9800" transform="rotate(-30 55 139)"/>
      <rect x="32" y="115" width="15" height="20" rx="2" fill="#4CAF50" transform="rotate(-30 40 125)"/>
    </svg>
  </div>
  
  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Cargando Tina...</div>
  </div>
  
  <!-- UI -->
  <div id="lang-selector">
    <button class="lang-btn active" data-lang="ES">ES</button>
    <button class="lang-btn" data-lang="EN">EN</button>
    <button class="lang-btn" data-lang="PT">PT</button>
  </div>
  
  <div id="zones" class="hidden">
    <div class="zone-dot" data-zone="1"></div>
    <div class="zone-dot" data-zone="2"></div>
    <div class="zone-dot" data-zone="3"></div>
    <div class="zone-dot" data-zone="4"></div>
  </div>
  
  <div id="timer" class="hidden">
    <svg viewBox="0 0 120 120">
      <circle class="bg" cx="60" cy="60" r="54"/>
      <circle class="progress" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="0"/>
    </svg>
    <div id="timer-text">30</div>
  </div>
  
  <div id="message"></div>
  <button id="restart-btn">🔄 Jugar de nuevo</button>
  
  <script>
    // App State
    let lang = 'ES';
    let zone = 0;
    let seconds = 30;
    let timer = null;
    
    // Elements
    const camera = document.getElementById('camera');
    const loading = document.getElementById('loading');
    const tinaContainer = document.getElementById('tina-container');
    const zonesEl = document.getElementById('zones');
    const timerEl = document.getElementById('timer');
    const timerText = document.getElementById('timer-text');
    const timerProgress = document.querySelector('.progress');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restart-btn');
    
    // Texts
    const TEXTS = {
      ES: {
        intro: '¡Hola! Soy Tina. ¡Vamos a cepillarnos los dientes juntos!',
        zone: 'Ahora cepillemos la zona {z}. ¡Inclina el cepillo 45° y haz círculos!',
        celebrate: '¡Fantástico! ¡Cepillaste todos tus dientes como un campeón! 🎉',
        restart: '🔄 Jugar de nuevo'
      },
      EN: {
        intro: 'Hi! I\'m Tina. Let\'s brush our teeth together!',
        zone: 'Now let\'s brush the {z} area. Tilt the brush 45° and make circles!',
        celebrate: 'Fantastic! You brushed all your teeth like a champion! 🎉',
        restart: '🔄 Play again'
      },
      PT: {
        intro: 'Olá! Sou Tina. Vamos escovar os dentes juntos!',
        zone: 'Agora vamos escovar a área {z}. Incline a escova 45° e faça círculos!',
        celebrate: 'Fantástico! Você escovou todos os dentes como um campeão! 🎉',
        restart: '🔄 Jogar de novo'
      }
    };
    
    const ZONE_NAMES = {
      ES: ['superior derecha', 'superior izquierda', 'inferior derecha', 'inferior izquierda'],
      EN: ['right upper', 'left upper', 'right lower', 'left lower'],
      PT: ['superior direita', 'superior esquerda', 'inferior direita', 'inferior esquerda']
    };
    
    // Init camera
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        camera.srcObject = stream;
        await camera.play();
        console.log('✅ Camera OK');
        return true;
      } catch (e) {
        console.error('❌ Camera error:', e);
        document.getElementById('loading-text').textContent = 'Activa la cámara';
        return false;
      }
    }
    
    // Speak
    function speak(text) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang === 'ES' ? 'es-ES' : lang === 'EN' ? 'en-US' : 'pt-PT';
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }
    }
    
    // Show message
    function show(text) {
      messageEl.textContent = text;
    }
    
    // Start experience
    function start() {
      loading.classList.add('hidden');
      tinaContainer.classList.remove('hidden');
      
      show(TEXTS[lang].intro);
      speak(TEXTS[lang].intro);
      
      setTimeout(() => nextZone(), 5000);
    }
    
    // Next zone
    function nextZone() {
      zone++;
      
      if (zone > 4) {
        celebrate();
        return;
      }
      
      seconds = 30;
      zonesEl.classList.remove('hidden');
      timerEl.classList.remove('hidden');
      
      // Update zone dots
      document.querySelectorAll('.zone-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i + 1 === zone);
      });
      
      const zoneName = ZONE_NAMES[lang][zone - 1];
      const text = TEXTS[lang].zone.replace('{z}', zoneName);
      show(text);
      speak(text);
      
      // Start timer
      clearInterval(timer);
      timer = setInterval(() => {
        seconds--;
        timerText.textContent = seconds;
        
        // Update progress
        const prog = (30 - seconds) / 30;
        timerProgress.style.strokeDashoffset = 339.292 * (1 - prog);
        
        // Color
        timerProgress.style.stroke = seconds > 10 ? '#4CAF50' : seconds > 5 ? '#FFC107' : '#F44336';
        
        if (seconds <= 0) {
          clearInterval(timer);
          nextZone();
        }
      }, 1000);
    }
    
    // Celebrate
    function celebrate() {
      zonesEl.classList.add('hidden');
      timerEl.classList.add('hidden');
      
      show(TEXTS[lang].celebrate);
      speak(TEXTS[lang].celebrate);
      
      // Confetti
      const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#FFB74D', '#4FC3F7'];
      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }
      
      // Show restart
      setTimeout(() => {
        restartBtn.style.display = 'block';
        restartBtn.textContent = TEXTS[lang].restart;
      }, 2000);
    }
    
    // Language buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        lang = btn.dataset.lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    
    // Restart
    restartBtn.onclick = () => location.reload();
    
    // Init
    initCamera().then(() => {
      setTimeout(start, 1000);
    });
  </script>
</body>
</html>
