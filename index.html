<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4FC3F7">
  <meta name="description" content="Tina AR - Experiencia educativa de realidad aumentada para enseñar técnica de cepillado dental a niños">
  
  <title>Tina AR - Doctora Dentina</title>
  
  <!-- Preload critical assets -->
  <link rel="preload" href="assets/models/Tina_optimized.glb" as="fetch" crossorigin>
  
  <!-- Preconnect to CDNs -->
  <link rel="preconnect" href="https://aframe.io">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  
  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- A-Frame AR component for WebXR -->
  <script src="https://unpkg.com/aframe-xr@0.1.0/dist/aframe-xr.min.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Cargando Tina...</div>
    <div id="loading-subtitle">Apunta al lavamanos para colocar a Tina</div>
  </div>
  
  <!-- UI Overlay Container -->
  <div id="ui-overlay"></div>
  
  <!-- Instructions Overlay -->
  <div id="tap-instruction" class="tap-instruction hidden">
    <div class="tap-icon">👆</div>
    <div class="tap-text">Toca la pantalla para colocar a Tina</div>
  </div>
  
  <!-- AR Scene with WebXR -->
  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    embedded
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    background="transparent: true"
  >
    <a-assets>
      <a-asset-item id="tina-model" src="assets/models/Tina_optimized.glb"></a-asset-item>
    </a-assets>
    
    <!-- Lighting -->
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.0" position="0 3 2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="2 2 0"></a-light>
    
    <!-- Camera -->
    <a-entity camera look-controls="enabled: false"></a-entity>
    
    <!-- Tina - placed via tap -->
    <a-entity 
      id="tina-anchor"
      visible="false"
    >
      <a-entity 
        id="tina" 
        gltf-model="#tina-model"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        rotation="0 0 0"
      ></a-entity>
    </a-entity>
  </a-scene>
  
  <script src="src/app-worldtracking.js" type="module"></script>
</body>
</html>
